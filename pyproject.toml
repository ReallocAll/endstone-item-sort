[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "endstone-item-sort"
version = "0.4.0"
description = "Inventory and Ender Chest sorting for Endstone servers"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
authors = [{ name = "ReallocAll" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.entry-points."endstone"]
item-sort = "endstone_item_sort:ItemSortPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_item_sort"]

[tool.ruff]
target-version = "py310"
line-length = 120
include = ["*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
