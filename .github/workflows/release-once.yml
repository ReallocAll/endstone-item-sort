name: One-time private ItemSort v0.4.0 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-once.yml

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: "github.event.head_commit.message == 'chore: publish ItemSort v0.4.0 privately'"
    runs-on: ubuntu-24.04
    steps:
      - name: Download wheel from successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38049117960 \
            --repo "$GITHUB_REPOSITORY" \
            --name item-sort-wheel-py3.15 \
            --dir "$RUNNER_TEMP/dist"
          test -f "$RUNNER_TEMP/dist/endstone_item_sort-0.4.0-py3-none-any.whl"
      - name: Validate release artifact
        run: |
          python3 - <<'PY'
          from email.parser import Parser
          from pathlib import Path
          import zipfile

          wheel = Path(__import__("os").environ["RUNNER_TEMP"]) / "dist/endstone_item_sort-0.4.0-py3-none-any.whl"
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              metadata_path = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = Parser().parsestr(archive.read(metadata_path).decode("utf-8"))
              assert metadata["Name"] == "endstone-item-sort"
              assert metadata["Version"] == "0.4.0"
              assert metadata["Requires-Python"] == ">=3.11"
              assert "endstone_item_sort/plugin.py" in names
              assert "endstone_item_sort/sorter.py" in names
              assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)
          print("Verified v0.4.0 release wheel metadata and files")
          PY
      - name: Publish private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Highlights

          - Sort the player's main inventory (slots 9–35) without changing the hotbar, armor or off-hand.
          - Sort Ender Chest contents with safe partial-stack merging, category ordering and compact placement.
          - Preserve item metadata and pinned special items; verify writes, attempt rollback and fail closed on failure.
          - Single `/itemsort` command with `inventory`, `ender` and `status` subcommands and native autocomplete.
          - Pure-Python, platform-independent wheel; no Bedrock private ABI hooks.

          ## Requirements

          - Python 3.11 or newer. The wheel passed CI on Python 3.11, 3.12, 3.13, 3.14 and 3.15.
          - Endstone plugin API 0.11. Python 3.15 server support also requires a compatible native Endstone build.
          - Ordinary chests, barrels and shulker-box block inventories are not supported by this version.

          ## Installation

          Download the attached wheel and install it into the Python environment running Endstone:

          ```bash
          uv pip install --python /path/to/endstone/.venv/bin/python endstone_item_sort-0.4.0-py3-none-any.whl
          ```

          Restart Endstone after installing. See the repository README for commands and optional ClockMenu integration.

          **Verification:** [successful CI run](https://github.com/ReallocAll/endstone-item-sort/actions/runs/38049117960), five Python versions, zero annotations.
          EOF

          gh release create v0.4.0 \
            "$RUNNER_TEMP/dist/endstone_item_sort-0.4.0-py3-none-any.whl" \
            --repo "$GITHUB_REPOSITORY" \
            --target c7ed5af54e4128bdd3932a7a13c6e76c5686db0f \
            --title "ItemSort v0.4.0" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/v0.4.0" --jq '.object.sha')" = \
            c7ed5af54e4128bdd3932a7a13c6e76c5686db0f
          gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,isPrerelease,assets
